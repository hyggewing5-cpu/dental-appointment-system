<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<meta name="robots" content="noindex,nofollow">
<title>ระบบหลังบ้าน — จัดการนัดทำฟัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<dialog id="dlg" aria-modal="true"></dialog>

<script src="engine.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function () {
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const { esc, ic, thaiDate: thai, call, toast } = DQ;
const U = DQ.util;
const app = $('#app'), dlg = $('#dlg');
const A = { view: 'schedule', date: null, opts: null, day: null, name: '', entered: false };
const NAV = [['schedule', 'ตารางนัด', 'calendar'], ['reports', 'รายงาน', 'chart'], ['patients', 'ผู้ป่วย', 'users'], ['closures', 'วันปิด', 'ban'], ['settings', 'ตั้งค่า', 'settings'], ['audit', 'ประวัติ', 'history']];
const ACTION_TH = { create: 'สร้างนัด', edit: 'แก้ไขข้อมูล', move: 'เปลี่ยนวัน/เวลา', status: 'เปลี่ยนสถานะ', reschedule: 'เลื่อนนัด (ผู้ป่วย)', closure_add: 'ปิดวัน', closure_remove: 'เปิดวัน', settings: 'ตั้งค่า', login: 'เข้าสู่ระบบ' };
const FIELD_TH = { title: 'คำนำหน้า', firstName: 'ชื่อ', lastName: 'นามสกุล', age: 'อายุ', phone: 'เบอร์โทร', rights: 'สิทธิ', treatment: 'การรักษา', note: 'หมายเหตุ', from: 'จาก', to: 'เป็น', reason: 'เหตุผล', date: 'วันที่', time: 'เวลา', source: 'ช่องทาง', session: 'ช่วง', affected: 'ผู้ป่วยที่ได้รับผลกระทบ', dates: 'วันที่', newApptNo: 'นัดใหม่', durationMin: 'นาที' };
const STATUS_ORDER = ['waiting', 'treating', 'done', 'cancelled', 'noshow'];
const GROUP_TH = { fill: 'อุดฟัน', scale_extract: 'ขูดหินปูน / ถอนฟัน' };
const SRC_TH = { online: 'จองออนไลน์', admin: 'เจ้าหน้าที่', walkin: 'Walk-in' };
const isFree = a => a.status === 'cancelled' || a.status === 'noshow';
const fmtPhone = p => { p = String(p || ''); return p.length === 10 ? `${p.slice(0, 3)}-${p.slice(3, 6)}-${p.slice(6)}` : p; };
const fullName = a => `${a.title}${a.firstName} ${a.lastName}`;
const tomin = t => { const p = t.split(':'); return +p[0] * 60 + +p[1]; };

/* ======================= Dialog ======================= */
function openDlg(title, body, foot) {
  dlg.innerHTML = `<div class="modal-h"><h3>${title}</h3><button class="icon-btn" data-close aria-label="ปิด">${ic('x')}</button></div><div class="modal-b">${body}${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  if (!dlg.open) dlg.showModal();
  return dlg;
}
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.close(); });
const closeDlg = () => { if (dlg.open) dlg.close(); };

/* ======================= Login / Shell ======================= */
function showLogin(msg) {
  A.entered = false; closeDlg();
  app.innerHTML = `<div class="login-wrap"><form class="card login-card" id="lf" novalidate>
    <div class="row" style="margin-bottom:18px"><span class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="${'M12 2.5c-2 0-3.2 1-5 1-2.2 0-3.5 1.7-3.5 4.2 0 2.2 1 3.7 1.6 6 .6 2.3.8 7.3 2.9 7.3 1.6 0 1.4-4.2 4-4.2s2.4 4.2 4 4.2c2.1 0 2.3-5 2.9-7.3.6-2.3 1.6-3.8 1.6-6 0-2.5-1.3-4.2-3.5-4.2-1.8 0-3-1-5-1z'}"/></svg></span>
    <div><h1 style="font-size:1.25rem">ระบบหลังบ้าน</h1><span class="muted small">เฉพาะเจ้าหน้าที่ที่ได้รับอนุญาต</span></div></div>
    ${msg ? `<div class="notice bad" style="margin-bottom:14px">${ic('alert')}<span>${esc(msg)}</span></div>` : ''}
    <div class="field"><label for="u">ชื่อผู้ใช้</label><input class="input" id="u" autocomplete="username" autocapitalize="off" required></div>
    <div class="field mt"><label for="p">รหัสผ่าน</label><input class="input" id="p" type="password" autocomplete="current-password" required></div>
    <button class="btn primary block mt-l" type="submit">${ic('lock', 18)}เข้าสู่ระบบ</button>
    ${DQ.DEMO ? '<p class="xs muted mt" style="text-align:center">โหมดสาธิต: admin / admin1234</p>' : ''}
    <p class="xs muted mt" style="text-align:center"><a href="./">← กลับหน้าจองของผู้ป่วย</a></p></form></div>`;
  $('#u').focus();
  $('#lf').addEventListener('submit', async e => {
    e.preventDefault(); const b = $('button[type=submit]', app);
    DQ.busy(b, true, 'กำลังเข้าสู่ระบบ…');
    try {
      const r = await call('adminLogin', { username: $('#u').value, password: $('#p').value });
      DQ.setToken(r.token); A.name = r.name; enter();
    } catch (err) { DQ.busy(b, false); showLogin(err.message); }
  });
}
window.addEventListener('dq:auth', () => { if (A.entered) showLogin('หมดเวลาการเข้าสู่ระบบ กรุณาเข้าสู่ระบบอีกครั้ง'); });

async function enter() {
  try { A.opts = await call('adminOptions'); } catch (e) { return showLogin(e.message); }
  A.entered = true; A.date = A.opts.today;
  const nav = cls => NAV.map(([k, t, i]) => `<button class="nav-i" data-nav="${k}">${ic(i)}<span>${t}</span></button>`).join('');
  app.innerHTML = `<div class="shell"><aside class="side">
      <div class="brand" style="padding:4px 8px 16px"><span class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-2 0-3.2 1-5 1-2.2 0-3.5 1.7-3.5 4.2 0 2.2 1 3.7 1.6 6 .6 2.3.8 7.3 2.9 7.3 1.6 0 1.4-4.2 4-4.2s2.4 4.2 4 4.2c2.1 0 2.3-5 2.9-7.3.6-2.3 1.6-3.8 1.6-6 0-2.5-1.3-4.2-3.5-4.2-1.8 0-3-1-5-1z"/></svg></span><div><b>หลังบ้าน</b><span>${esc(A.opts.clinicName)}</span></div></div>
      ${nav()}<div style="flex:1"></div>
      <div class="small muted" style="padding:8px 14px">${ic('user', 16)} ${esc(A.name)}</div>
      <button class="nav-i" data-act="logout">${ic('logout')}<span>ออกจากระบบ</span></button></aside>
    <div><div class="topbar" style="position:static"><div class="container" style="max-width:none;padding:0 16px;min-height:54px"><span class="small muted">${ic('user', 16)} ${esc(A.name)}</span><span class="spacer"></span><a class="btn sm ghost" href="./" target="_blank" rel="noopener">หน้าผู้ป่วย</a><button class="btn sm ghost" data-act="logout">${ic('logout', 16)}ออก</button></div></div>
    <main class="main" id="main"></main></div></div>
    <nav class="bottom" aria-label="เมนูหลัก">${nav()}</nav>`;
  go(A.view);
}
app.addEventListener('click', e => {
  const n = e.target.closest('[data-nav]'); if (n) return go(n.dataset.nav);
  if (e.target.closest('[data-act="logout"]')) { call('adminLogout').catch(() => {}); DQ.setToken(''); showLogin(); }
});
function go(v) {
  A.view = v;
  document.querySelectorAll('[data-nav]').forEach(b => { if (b.dataset.nav === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  ({ schedule: viewSchedule, reports: viewReports, patients: viewPatients, closures: viewClosures, settings: viewSettings, audit: viewAudit })[v]();
  window.scrollTo(0, 0);
}
const main = () => $('#main');
const loading = () => { main().innerHTML = '<div class="skeleton" style="height:120px"></div><div class="skeleton mt" style="height:300px"></div>'; };
const failBox = (e, retry) => { main().innerHTML = `<div class="notice bad">${ic('alert')}<span>${esc(e.message)} <button class="btn sm" id="retry">ลองใหม่</button></span></div>`; $('#retry').onclick = retry; };

/* ======================= ตารางนัด ======================= */
async function viewSchedule() {
  loading();
  try { A.day = await call('adminSchedule', { date: A.date }); } catch (e) { return failBox(e, viewSchedule); }
  const d = A.day, appts = d.appts;
  const am = appts.filter(a => a.session === 'AM'), pm = appts.filter(a => a.session === 'PM'), wk = appts.filter(a => a.session === 'WALKIN');
  const slotAppt = t => am.find(a => a.time === t && !isFree(a));
  const inactive = appts.filter(isFree);
  const isToday = d.date === d.today;

  const stats = STATUS_ORDER.map(s => `<div class="stat ${DQ.STATUS[s].cls}"><b>${d.counts[s]}</b><span>${DQ.STATUS[s].th}</span></div>`).join('');
  const stale = d.stale.length ? `<div class="banner warn">${ic('alert', 22)}<div><b>มีนัดของวันก่อนหน้าที่ยังไม่ปิดสถานะ ${d.stale.length} รายการ</b><div class="small">ผู้ป่วยกลุ่มนี้จะจองออนไลน์ใหม่ไม่ได้จนกว่าจะเปลี่ยนสถานะเป็น เสร็จสิ้น / ไม่มาตามนัด / ยกเลิก</div>
    <div class="mt-s" style="display:flex;flex-wrap:wrap;gap:6px">${d.stale.slice(0, 8).map(a => `<button class="btn sm" data-goto="${a.date}">${thai(a.date, { shortDay: true, noYear: true })} · ${esc(a.firstName)} ${esc(a.lastName)}</button>`).join('')}</div></div></div>` : '';
  const closed = d.closure ? `<div class="banner bad">${ic('ban', 22)}<div class="grow"><b>วันนี้ปิดให้บริการ</b> — ${esc(d.closure.reason)}${appts.some(a => !isFree(a) && a.session !== 'WALKIN') ? '<div class="small">มีผู้ป่วยที่จองไว้ก่อนปิดวัน ระบบไม่ยกเลิกให้อัตโนมัติ กรุณาติดต่อผู้ป่วยเพื่อเลื่อน/ยกเลิก</div>' : ''}</div><button class="btn sm" data-act="reopen" data-d="${d.date}">เปิดวันนี้อีกครั้ง</button></div>` : '';

  /* ช่วงเช้า */
  let amHtml;
  if (!d.openAM) amHtml = `<div class="notice">${ic('info')}<span>${U.dow(d.date) === 0 || U.dow(d.date) === 6 ? 'วันเสาร์–อาทิตย์ไม่เปิดให้บริการ' : 'วันนี้ไม่เปิดให้บริการช่วงเช้า'}</span></div>`;
  else amHtml = '<div class="list">' + d.slots.map(s => {
    const a = slotAppt(s.time);
    return `<div class="slot-row"><div class="slot-time">${s.time}<small>${s.group === 'fill' ? 'อุดฟัน' : 'ขูด/ถอน'}</small></div>` +
      (a ? card(a) : `<div class="empty-slot"><span>ว่าง — เปิดรับ ${GROUP_TH[s.group] || ''}</span><button class="btn sm" data-add="AM" data-time="${s.time}">${ic('plus', 16)}เพิ่มนัด</button></div>`) + '</div>';
  }).join('') + '</div>';

  /* ช่วงบ่าย */
  const pmAct = pm.filter(a => !isFree(a)).sort((a, b) => a.time < b.time ? -1 : 1);
  const s0 = tomin(d.pmStart), s1 = tomin(d.pmEnd), span = s1 - s0;
  let pmHtml;
  if (!d.openPM) pmHtml = `<div class="notice">${ic('info')}<span>${U.dow(d.date) === 5 ? 'วันศุกร์ปิดให้บริการช่วงบ่าย' : 'วันนี้ไม่มีนัดช่วงบ่าย'}</span></div>`;
  else {
    const ticks = []; for (let m = s0; m <= s1; m += 30) ticks.push(`${('0' + Math.floor(m / 60)).slice(-2)}:${('0' + m % 60).slice(-2)}`);
    pmHtml = `<div class="tl" aria-hidden="true">${pmAct.map(a => `<i style="left:${(tomin(a.time) - s0) / span * 100}%;width:${(tomin(a.endTime) - tomin(a.time)) / span * 100}%"></i>`).join('')}</div><div class="tl-scale">${ticks.map(t => `<span>${t}</span>`).join('')}</div>` +
      `<div class="list">${pmAct.length ? pmAct.map(a => `<div class="slot-row"><div class="slot-time">${a.time}<small>ถึง ${a.endTime}</small></div>${card(a)}</div>`).join('') : '<div class="empty-slot"><span>ยังไม่มีนัดช่วงบ่าย</span></div>'}</div>`;
  }

  main().innerHTML = `
    <div class="adm-top"><h1>ตารางนัดหมาย</h1>
      <div class="date-nav"><button class="icon-btn" data-day="-1" aria-label="วันก่อนหน้า">${ic('chevL')}</button>
      <input class="input" type="date" id="dpick" value="${d.date}" aria-label="เลือกวันที่"><button class="icon-btn" data-day="1" aria-label="วันถัดไป">${ic('chevR')}</button>
      <button class="btn sm" data-day="0"${isToday ? ' disabled' : ''}>วันนี้</button></div></div>
    <p class="muted" style="margin:-6px 0 14px"><b style="color:var(--ink)">${thai(d.date, { full: true })}</b>${isToday ? ' · วันนี้' : ''}</p>
    ${stale}${closed}<div class="stats">${stats}</div>
    <section class="sec"><div class="sec-h"><h2>ช่วงเช้า <small>09:00–11:30 น. · จองออนไลน์ได้</small></h2></div>${amHtml}</section>
    <section class="sec"><div class="sec-h"><h2>ช่วงบ่าย <small>${esc(d.pmStart)}–${esc(d.pmEnd)} น. · เจ้าหน้าที่/ทันตแพทย์กำหนด</small></h2>${d.openPM && !d.closure ? `<button class="btn sm primary" data-add="PM">${ic('plus', 16)}เพิ่มนัดช่วงบ่าย</button>` : ''}</div>${pmHtml}</section>
    <section class="sec"><div class="sec-h"><h2>Walk-in <small>${esc(d.walkinStart)}–${esc(d.walkinEnd)} น. · ฉุกเฉิน/ปวดฟันรุนแรง</small></h2>${d.openAM ? `<button class="btn sm" data-add="WALKIN">${ic('plus', 16)}บันทึก Walk-in</button>` : ''}</div>
      <div class="list">${wk.length ? wk.map(card).join('') : '<div class="empty-slot"><span>ยังไม่มีรายการ Walk-in</span></div>'}</div></section>
    ${inactive.length ? `<section class="sec"><div class="sec-h"><h2>ยกเลิก / ไม่มาตามนัด <small>${inactive.length} รายการ · คิวถูกคืนให้ระบบแล้ว</small></h2></div><div class="list">${inactive.map(card).join('')}</div></section>` : ''}`;
}

function card(a) {
  const sb = STATUS_ORDER.map(s => `<button class="sb ${DQ.STATUS[s].cls}${a.status === s ? ' on' : ''}" data-st="${s}" data-no="${a.apptNo}" aria-pressed="${a.status === s}">${DQ.STATUS[s].th}</button>`).join('');
  return `<article class="appt ${DQ.STATUS[a.status].cls}" data-no="${a.apptNo}">
    <div class="row between wrap"><span class="nm">${esc(fullName(a))} <span class="muted small" style="font-weight:400">· ${esc(a.age)} ปี</span></span>${DQ.statusPill(a.status)}</div>
    <div class="meta"><span>${ic('phone', 14)} <a href="tel:${esc(a.phone)}">${fmtPhone(a.phone)}</a></span><span>${ic('tooth', 14)} ${esc(a.treatment)}</span><span>${ic('shield', 14)} ${esc(a.rights)}</span>
      ${a.session === 'PM' ? `<span>${ic('clock', 14)} ${a.time}–${a.endTime} (${a.durationMin} นาที)</span>` : ''}<span class="num">${esc(a.apptNo)}</span><span>${SRC_TH[a.source] || ''}</span></div>
    ${a.note ? `<div class="small muted">หมายเหตุ: ${esc(a.note)}</div>` : ''}
    <div class="statusbar" role="group" aria-label="เปลี่ยนสถานะ">${sb}</div>
    <div class="tools"><button class="btn sm" data-edit="${a.apptNo}">${ic('edit', 15)}แก้ไข</button>${a.session !== 'WALKIN' && !isFree(a) ? `<button class="btn sm" data-move="${a.apptNo}">${ic('move', 15)}เปลี่ยนวัน/เวลา</button>` : ''}<button class="btn sm ghost" data-hist="${a.apptNo}">${ic('history', 15)}ประวัติผู้ป่วย</button></div></article>`;
}

/* ---- เหตุการณ์ในหน้าตารางนัด ---- */
document.addEventListener('click', async e => {
  if (!A.entered) return;
  const t = e.target;
  let b;
  if ((b = t.closest('[data-day]'))) { const n = +b.dataset.day; A.date = n === 0 ? A.opts.today : U.addDays(A.date, n); return viewSchedule(); }
  if ((b = t.closest('[data-goto]'))) { A.date = b.dataset.goto; return viewSchedule(); }
  if ((b = t.closest('[data-add]'))) return openCreate(b.dataset.add, A.date, b.dataset.time);
  if ((b = t.closest('[data-edit]'))) return openEdit(find(b.dataset.edit));
  if ((b = t.closest('[data-move]'))) return openMove(find(b.dataset.move));
  if ((b = t.closest('[data-hist]'))) { const a = find(b.dataset.hist); return openHistory(a); }
  if ((b = t.closest('[data-st]'))) return changeStatus(b.dataset.no, b.dataset.st);
  if ((b = t.closest('[data-act="reopen"]'))) {
    try { await call('adminRemoveClosure', { date: b.dataset.d }); toast('เปิดวันให้บริการแล้ว', 'ok'); refresh(); } catch (err) { toast(err.message, 'err'); }
  }
});
document.addEventListener('change', e => { if (A.entered && e.target.id === 'dpick' && e.target.value) { A.date = e.target.value; viewSchedule(); } });
const find = no => (A.day && (A.day.appts.concat(A.day.stale)).find(a => a.apptNo === no)) || A.hist && A.hist.find(a => a.apptNo === no);
const refresh = () => { if (A.view === 'schedule') viewSchedule(); else if (A.view === 'closures') viewClosures(); };

async function changeStatus(no, st) {
  const a = find(no); if (!a || a.status === st) return;
  if (st === 'cancelled' || st === 'noshow') {
    const label = DQ.STATUS[st].th;
    openDlg(`${label} — ${esc(fullName(a))}`,
      `<p class="small muted">${st === 'noshow' ? 'ผู้ป่วยที่ไม่มาตามนัดสามารถจองใหม่ได้ทันที ระบบจะเก็บประวัติไว้ให้ตรวจสอบ' : 'เมื่อยกเลิก คิวนี้จะถูกคืนให้ระบบและเปิดให้จองใหม่ได้ (ไม่ลบข้อมูลนัดเดิม)'}</p>
       <div class="field mt"><label for="rs">เหตุผล / หมายเหตุ (ไม่บังคับ)</label><textarea class="input" id="rs" rows="2" maxlength="120"></textarea></div><div id="derr"></div>`,
      `<button class="btn" data-close>ปิด</button><button class="btn ${st === 'cancelled' ? 'danger' : 'primary'}" id="ok">ยืนยัน ${label}</button>`);
    $('#ok').onclick = async function () {
      DQ.busy(this, true);
      try { await call('adminSetStatus', { apptNo: no, status: st, reason: $('#rs').value }, { requestId: DQ.uuid() }); closeDlg(); toast(`บันทึกสถานะ “${label}” แล้ว`, 'ok'); refresh(); }
      catch (err) { DQ.busy(this, false); $('#derr').innerHTML = `<div class="notice bad mt">${esc(err.message)}</div>`; }
    };
    return;
  }
  try { await call('adminSetStatus', { apptNo: no, status: st }, { requestId: DQ.uuid() }); toast(`เปลี่ยนเป็น “${DQ.STATUS[st].th}” แล้ว`, 'ok'); refresh(); }
  catch (err) { toast(err.message, 'err'); }
}

/* ======================= ฟอร์มนัดหมาย ======================= */
const optList = (arr, sel) => arr.map(x => `<option${x === sel ? ' selected' : ''}>${esc(x)}</option>`).join('');
function personFields(v) {
  v = v || {};
  const tsel = !v.title ? A.opts.titles[0] : (A.opts.titles.includes(v.title) ? v.title : A.opts.otherTitle);
  return `<div class="grid2"><div class="field"><label for="f-title">คำนำหน้า</label><select class="input" id="f-title">${optList(A.opts.titles, tsel)}</select>
    <input class="input" id="f-title-o" maxlength="20" placeholder="พิมพ์คำนำหน้า เช่น ร.ท., ดร." value="${tsel === A.opts.otherTitle ? esc(v.title) : ''}" style="margin-top:8px"${tsel === A.opts.otherTitle ? '' : ' hidden'}></div>
    <div class="field"><label for="f-age">อายุ</label><input class="input" id="f-age" inputmode="numeric" maxlength="3" value="${esc(v.age || '')}"></div>
    <div class="field"><label for="f-first">ชื่อ</label><input class="input" id="f-first" maxlength="60" value="${esc(v.firstName || '')}"></div>
    <div class="field"><label for="f-last">นามสกุล</label><input class="input" id="f-last" maxlength="60" value="${esc(v.lastName || '')}"></div></div>

function amTimeSelect(dayAppts, treat, selected, selfNo) {
  const g = groupOf(treat);
  return A.opts.amSlots.filter(s => s.group === g).map(s => {
    const busy = dayAppts.some(a => a.session === 'AM' && a.time === s.time && !isFree(a) && a.apptNo !== selfNo);
    return `<option value="${s.time}"${s.time === selected ? ' selected' : ''}${busy ? ' disabled' : ''}>${s.time} น.${busy ? ' (ไม่ว่าง)' : ''}</option>`;
  }).join('');
}

function fmtDetail(s) {
  let o; try { o = JSON.parse(s); } catch (e) { return esc(s); }
  if (!o || typeof o !== 'object') return esc(s);
  return Object.keys(o).map(k => {
    const v = o[k], lab = FIELD_TH[k] || (k === 'dates' ? 'วันที่' : k);
    if (Array.isArray(v)) return `${lab}: ${esc(v[0])} → ${esc(v[1])}`;
    if (k === 'to' && o.from && (o.from in DQ.STATUS)) return `${DQ.STATUS[o.from].th} → ${DQ.STATUS[v] ? DQ.STATUS[v].th : esc(v)}`;
    if (k === 'from' && (v in DQ.STATUS)) return '';
    return v === '' ? '' : `${lab}: ${esc(typeof v === 'object' ? JSON.stringify(v) : v)}`;
  }).filter(Boolean).join(' · ');
}

  });

    openDlg(done ? 'ปิดวันแล้ว — โปรดติดต่อผู้ป่วย' : 'มีผู้ป่วยได้รับผลกระทบ',

  }
}

/* ======================= สรุป / รายงาน ======================= */
A.rep = { tab: 'day', date: null, month: null };
const num = n => n == null ? '–' : Number(n).toLocaleString('th-TH');
const pctTxt = v => v == null ? '–' : v + '%';
const shiftDate = (ds, n) => { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };
const shiftMonth = (ym, n) => { const d = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); };
const hbars = (items, unit, noPct) => { const max = Math.max(1, ...items.map(i => i.count)), tot = items.reduce((s, i) => s + i.count, 0);
  return items.length ? `<div class="hbars">${items.map(i => `<div class="hb"><span title="${esc(i.label || i.key)}">${esc(i.label || i.key)}</span><span class="tr"><i style="width:${Math.max(3, i.count / max * 100)}%"></i></span><b>${num(i.count)}${unit ? ' ' + unit : ''}${noPct ? '' : `<em>${tot ? Math.round(i.count * 100 / tot) : 0}%</em>`}</b></div>`).join('')}</div>` : '<p class="muted small">ยังไม่มีข้อมูล</p>'; };
const kpi = (label, val, sub, cls) => `<div class="kpi ${cls || ''}"><small>${label}</small><b>${val}</b><span class="sub">${sub || '&nbsp;'}</span></div>`;
const delta = (cur, prev, suffix) => { if (prev == null || cur == null) return 'เดือนก่อน: –'; const d = Math.round((cur - prev) * 10) / 10; return `${d > 0 ? '▲ +' : d < 0 ? '▼ ' : '＝ '}${d === 0 ? 'เท่าเดิม' : d}${d === 0 ? '' : (suffix || '')} จากเดือนก่อน`; };
const printHead = title => `<div class="print-only"><b style="font-size:1.2rem">${esc(A.opts.clinicName)}</b><br>${title}<br><span class="small muted">พิมพ์เมื่อ ${thai(A.opts.today, { full: true })} โดย ${esc(A.name)}</span></div>`;

function viewReports() {
  const R = A.rep; if (!R.date) R.date = A.opts.today; if (!R.month) R.month = A.opts.today.slice(0, 7);
  main().innerHTML = `<div class="adm-top" data-noprint><h1>สรุป / รายงาน</h1></div>

  main().querySelectorAll('[data-rt]').forEach(b => b.onclick = () => { R.tab = b.dataset.rt; viewReports(); });
  (R.tab === 'day' ? repDay : repMonth)();
}

async function repDay() {

    (d.next.appts.length ? `<div class="tbl-wrap"><table class="table"><thead><tr><th>เวลา</th><th>ชื่อ–นามสกุล</th><th>เบอร์โทร</th><th>การรักษา</th><th>สถานะ</th></tr></thead><tbody>${d.next.appts.map(a => `<tr><td class="num nowrap">${a.time}${a.endTime ? '–' + a.endTime : ''}</td><td>${esc(fullName(a))}</td><td class="num nowrap"><a href="tel:${esc(a.phone)}">${fmtPhone(a.phone)}</a></td><td>${esc(a.treatment)}</td><td>${DQ.statusPill(a.status)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small">ยังไม่มีผู้ป่วยนัดในวันนั้น</p>') + '</div>' : '';
  box.innerHTML = `<div class="rp-bar" data-noprint><h2>${thai(d.date, { full: true })}</h2><span class="grow"></span>
      <button class="btn sm" data-d="-1" aria-label="วันก่อนหน้า">‹</button><input class="input" type="date" id="rd" value="${d.date}" style="width:auto;min-height:40px"><button class="btn sm" data-d="1" aria-label="วันถัดไป">›</button><button class="btn sm" data-d="0">วันนี้</button>
      <button class="btn sm" id="rgo">${ic('calendar', 16)}เปิดตารางนัด</button><button class="btn sm" onclick="window.print()">${ic('print', 16)}พิมพ์</button></div>
    ${printHead('สรุปการจองประจำวัน ' + thai(d.date, { full: true }))}${closedMsg}
    <div class="kpis">${kpi('นัดทั้งหมด', num(c.total), `ช่วงเช้า ${d.bySession.AM.total} · บ่าย ${d.bySession.PM.total} · Walk-in ${d.bySession.WALKIN.total}`)}${kpi('เสร็จสิ้น', num(c.done), 'รับบริการแล้ว', 'k-done')}${kpi('รอ / กำลังรักษา', num(pend), `รอ ${c.waiting} · กำลังรักษา ${c.treating}`, 'k-pend')}${kpi('ไม่มาตามนัด', num(c.noshow), '', 'k-mute')}${kpi('ยกเลิก', num(c.cancelled), '', 'k-bad')}</div>

function colChart(days) {
  const W = 760, H = 230, pl = 30, pb = 26, pt = 10, n = days.length, bw = (W - pl) / n, max = Math.max(4, ...days.map(x => x.total)), sc = (H - pb - pt) / max;
  let g = ''; for (let i = 0; i <= 4; i++) { const v = Math.round(max * i / 4), y = H - pb - v * sc; g += `<line class="c-grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text class="c-txt" x="${pl - 6}" y="${y + 3}" text-anchor="end">${v}</text>`; }
  const bars = days.map((x, i) => {
    const X = pl + i * bw + bw * .16, w = bw * .68; let y = H - pb; const seg = (v, cls) => { if (!v) return ''; const h = v * sc; y -= h; return `<rect class="${cls}" x="${X}" y="${y}" width="${w}" height="${h}" rx="2"/>`; };
    const tip = `${x.date.slice(8)} · เสร็จสิ้น ${x.done} · รอ/กำลังรักษา ${x.waiting + x.treating} · ไม่มา ${x.noshow} · ยกเลิก ${x.cancelled}`;
    return `<g><title>${esc(tip)}</title>${x.open ? '' : `<rect class="c-off" x="${X}" y="${H - pb - 4}" width="${w}" height="4" rx="2"/>`}${seg(x.done, 'c-done')}${seg(x.waiting + x.treating, 'c-pend')}${seg(x.noshow, 'c-noshow')}${seg(x.cancelled, 'c-cancel')}<text class="c-txt" x="${X + w / 2}" y="${H - 8}" text-anchor="middle">${+x.date.slice(8)}</text></g>`;
  }).join('');
  return `<div class="chart-scroll"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟจำนวนนัดรายวันของเดือน แยกตามสถานะ">${g}${bars}</svg></div>
    <div class="legend"><span style="--c:var(--ok)">เสร็จสิ้น</span><span style="--c:var(--warn)">รอ / กำลังรักษา</span><span style="--c:var(--mute)">ไม่มาตามนัด</span><span style="--c:var(--bad)">ยกเลิก</span><span style="--c:var(--mute-bg)">วันไม่เปิดบริการ</span></div>`;
}

      <div class="rp-card"><h3>ช่องทางการนัด</h3>${hbars(r.bySource.map(x => ({ key: x.key, label: SRC_TH[x.key] || x.key, count: x.count })))}</div>
      <div class="rp-card"><h3>ผู้ป่วยและการเปลี่ยนแปลงนัด</h3><div class="hbars">
        <div class="hb"><span>ผู้ป่วยที่รับบริการ (ไม่ซ้ำคน)</span><span></span><b>${num(r.patients.unique)}</b></div><div class="hb"><span>— รายใหม่</span><span></span><b>${num(r.patients.fresh)}</b></div><div class="hb"><span>— รายเก่า</span><span></span><b>${num(r.patients.returning)}</b></div>
        <div class="hb"><span>ผู้ป่วยยกเลิกเองผ่านเว็บ</span><span></span><b>${num(r.selfCancel)}</b></div><div class="hb"><span>เลื่อนนัดผ่านเว็บ/เจ้าหน้าที่</span><span></span><b>${num(r.rescheduled)}</b></div></div>
        <p class="xs muted mt-s">“รายใหม่” นับจากครั้งแรกที่เสร็จสิ้นการรักษาในข้อมูลที่เก็บไว้ (ไม่เกิน 1 ปี)</p></div>
      ${r.closures.length ? `<div class="rp-card"><h3>วันปิดให้บริการในเดือนนี้ (${r.closures.length} วัน)</h3><div class="hbars">${r.closures.map(x => `<div class="hb"><span>${thai(x.date, { shortDay: true, noYear: true })}</span><span></span><b style="white-space:normal;text-align:right">${esc(x.reason)}</b></div>`).join('')}</div></div>` : ''}
      <div class="rp-card wide"><h3>ตารางสรุปรายวัน</h3><div class="tbl-wrap"><table class="table"><thead><tr><th>วันที่</th><th>นัดทั้งหมด</th><th>ช่วงเช้า</th><th>ช่วงบ่าย</th><th>Walk-in</th><th>เสร็จสิ้น</th><th>รอ/รักษา</th><th>ไม่มา</th><th>ยกเลิก</th></tr></thead><tbody>${dayRows || '<tr><td colspan="9" class="muted">ไม่มีข้อมูลในเดือนนี้</td></tr>'}</tbody></table></div>
      <p class="xs muted mt-s">ช่วงเช้า/บ่าย/Walk-in นับเฉพาะนัดที่ไม่ถูกยกเลิกหรือไม่มาตามนัด</p></div></div>`;
  const setM = v => { R.month = v; repMonth(); };
  box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => setM(b.dataset.m === '0' ? A.opts.today.slice(0, 7) : shiftMonth(R.month, +b.dataset.m)));
  $('#rm', box).onchange = e => { if (/^\d{4}-\d{2}$/.test(e.target.value)) setM(e.target.value); };
  $('#csv', box).onclick = () => {
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const head = ['วันที่', 'นัดทั้งหมด', 'ช่วงเช้า', 'ช่วงบ่าย', 'Walk-in', 'เสร็จสิ้น', 'รอรับบริการ', 'กำลังรักษา', 'ไม่มาตามนัด', 'ยกเลิก', 'หมายเหตุ'];
    const rows = r.days.map(x => [x.date, x.total, x.am, x.pm, x.walkin, x.done, x.waiting, x.treating, x.noshow, x.cancelled, x.closed ? 'ปิดให้บริการ' : (x.open ? '' : 'วันหยุด')]);
    rows.push(['รวม', t.total, '', '', '', t.done, t.waiting, t.treating, t.noshow, t.cancelled, '']);
    const csv = '﻿' + [head].concat(rows).map(a => a.map(q).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), a = document.createElement('a');
    a.href = url; a.download = 'dental-report-' + r.month + '.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
  };
}

  showLogin();
})();
})();
</script>
